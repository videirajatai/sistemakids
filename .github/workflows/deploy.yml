name: Deploy to GitHub Pages (alternativo)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # <-- importante
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Build project
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          fi

      - name: Determine upload path
        id: set-path
        run: |
          if [ -d "dist" ]; then
            echo "upload_path=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "upload_path=build" >> $GITHUB_OUTPUT
          else
            echo "upload_path=." >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.set-path.outputs.upload_path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./artifact

      - name: Deploy para branch 'deploy'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: ./artifact
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
